name: Publish Docker Images to Docker Hub

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata for evilnovnc
        id: meta-evilnovnc
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/evilnovnc
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push evilnovnc image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./evilnovnc.Dockerfile
          push: true
          tags: ${{ steps.meta-evilnovnc.outputs.tags }}
          labels: ${{ steps.meta-evilnovnc.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/evilnovnc:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/evilnovnc:buildcache,mode=max
      
      - name: Extract metadata for evilnginx
        id: meta-evilnginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/evilnginx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push evilnginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx.Dockerfile
          push: true
          tags: ${{ steps.meta-evilnginx.outputs.tags }}
          labels: ${{ steps.meta-evilnginx.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/evilnginx:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/evilnginx:buildcache,mode=max
